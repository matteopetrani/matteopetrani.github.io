<!-- Structured data (schema.org / JSON-LD) -->
{%- assign lang = page.lang | default: 'it' -%}
{%- assign page_url = page.url | absolute_url -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": "{{ site.url }}/#person",
      "name": "{{ site.author.name | default: site.title }}",
      "url": "{{ site.author.url | default: site.url }}"{% if site.author.sameAs %},
      "sameAs": [{% for link in site.author.sameAs %}"{{ link }}"{% unless forloop.last %}, {% endunless %}{% endfor %}]{% endif %}
    },
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}/#website",
      "url": "{{ site.url }}",
      "name": "{{ site.title | escape }}",
      "description": "{{ site.description | strip_html | normalize_whitespace | escape }}",
      "inLanguage": "{{ lang }}",
      "publisher": { "@id": "{{ site.url }}/#person" }
    }{% if page.layout == 'home' %},
    {
      "@type": "Blog",
      "@id": "{{ site.url }}/#blog",
      "url": "{{ page_url }}",
      "name": "{{ site.title | escape }}",
      "inLanguage": "{{ lang }}",
      "author": { "@id": "{{ site.url }}/#person" },
      "publisher": { "@id": "{{ site.url }}/#person" }
    }{% elsif page.layout == 'post' %},
    {
      "@type": "BlogPosting",
      "headline": "{{ page.title | strip_html | escape }}",
      "description": "{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}",
      "url": "{{ page_url }}",
      "mainEntityOfPage": "{{ page_url }}",
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      "dateModified": "{{ page.date | date_to_xmlschema }}",
      "inLanguage": "{{ lang }}",
      "author": { "@id": "{{ site.url }}/#person" },
      "publisher": { "@id": "{{ site.url }}/#person" }
    }{% elsif page.layout == 'page' %},
    {
      "@type": "WebPage",
      "url": "{{ page_url }}",
      "name": "{{ page.title | default: site.title | escape }}",
      "description": "{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}",
      "inLanguage": "{{ lang }}",
      "isPartOf": { "@id": "{{ site.url }}/#website" }
    }{% endif %}
  ]
}
</script>
